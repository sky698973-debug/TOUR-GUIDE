<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Darius Deedea Tour Guide</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .login-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #666;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #198754;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #198754;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #146c43;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
        }

        .register-link a {
            color: #198754;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>Welcome Back</h1>

    <p>Login to book your tour</p>


    <!-- LOGIN FORM -->

    <form action="/login" method="POST">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>


    </form>


    <!-- REGISTER -->

    <div class="register-link">

        <p>
            Don't have an account?

            <a href="/register.html">
                Create Account
            </a>
        </p>

    </div>


    <!-- HOME -->

    <a
        href="/"
        class="home-link"
    >
        ← Back to Home
    </a>


</div>


</body>

</html>
